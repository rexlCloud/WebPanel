# Runs the web panel. Docker Compose reads the variables below from the .env file
# next to this file (see .env.example), then:
#   docker compose up -d --build
# Behind the nginx-proxy setup on the server, add the proxy overlay:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
services:
  panel:
    build: .
    image: rexlcloud-web
    container_name: rexlcloud-web
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-rexlCloud}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    ports:
      - "${PANEL_PORT:-8080}:80"
    extra_hosts:
      # Lets the login page use http://host.docker.internal:4343 for a master on the Docker host
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/app/storage

volumes:
  storage:
